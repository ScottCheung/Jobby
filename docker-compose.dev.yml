# @format

services:
  api:
    env_file:
      - path: ./Apps/user/.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
    command: >-
      sh -c "python -m alembic upgrade head &&
      uvicorn services.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/services
      --timeout-graceful-shutdown 3"
    volumes:
      - ./backend/services:/app/services
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/scripts:/app/scripts
      - ./worker/linkedinBot/services/job_text_parser.py:/app/linkedinBot/services/job_text_parser.py:ro
      - ./worker/application_core:/app/application_core:ro

