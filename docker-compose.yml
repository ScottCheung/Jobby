# @format

services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-job-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_job_applier}
      POSTGRES_USER: ${POSTGRES_USER:-auto_job}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auto_job_password}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-auto_job} -d ${POSTGRES_DB:-auto_job_applier}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api.Dockerfile
    container_name: auto-job-api
    restart: unless-stopped
    # Keep API token verification aligned with the public Supabase project used
    # by the Jobby web app and browser extension during local development.
    env_file:
      - path: ./Apps/user/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-auto_job}:${POSTGRES_PASSWORD:-auto_job_password}@postgres:5432/${POSTGRES_DB:-auto_job_applier}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.local}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Local Admin}
      ENABLE_API_LOCAL_WORKER: ${ENABLE_API_LOCAL_WORKER:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      RESUME_DEBUG_ENABLED: ${RESUME_DEBUG_ENABLED:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-jobby-assets}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      WATCHFILES_FORCE_POLLING: 'true'
    command: >-
      sh -c "python -m alembic upgrade head &&
      uvicorn services.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/services
      --timeout-graceful-shutdown 3"
    ports:
      - '${API_PORT:-8000}:8000'
    volumes:
      - ./backend/services:/app/services
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/scripts:/app/scripts
      - ./backend/application_core:/app/application_core:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

