<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn layout fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow-x: hidden; font-family: Arial, sans-serif; }
      #global-nav {
        position: fixed;
        inset: 0 0 auto 0;
        height: 64px;
        padding: 18px 48px;
        background: #fff;
        border-bottom: 1px solid #d0d7de;
        z-index: 2;
      }
      #app__container {
        width: 100vw;
        min-height: 100vh;
        padding: 96px 4vw 40px;
        background: #f3f2ef;
      }
      .scaffold-layout__inner {
        display: grid;
        grid-template-columns: minmax(320px, 42%) minmax(0, 1fr);
        gap: 16px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card { min-height: 720px; padding: 28px; background: #fff; border: 1px solid #d0d7de; }
      .detail { min-width: 0; }
      .coverage-probe { position: absolute; right: 0; top: 180px; width: 20px; height: 120px; background: #dc2626; }
    </style>
  </head>
  <body>
    <header id="global-nav">LinkedIn navigation</header>
    <main id="app__container">
      <div class="scaffold-layout__inner">
        <section class="card">Job results</section>
        <section class="card detail">Job detail — this must end before the Jobby panel.</section>
      </div>
      <div class="coverage-probe" aria-label="viewport-edge-probe"></div>
    </main>
  </body>
</html>
